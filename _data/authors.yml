# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
Gabie:
  name:              <Gabriela> <Sewdhan>
  email:             <gabiems13@gmail.com>

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
  about:             |

    Hi! I’m Gabby; a creator + developer (and co-owner of Scarlet Creative) based in Trinidad & Tobago.

    I’m deeply passionate about helping people feel less overwhelmed, more supported, and more able to do the work that matters to them.

    A lot of my perspective comes from navigating my own hard seasons and wanting to make things gentler for others. **I care about giving a voice to the voiceless, raising awareness, and bringing communities together to help revive the Earth and our shared humanity.**

    My favourite areas to dive into are **design (UI/UX, graphic, motion), human–computer interaction, using art for storytelling, psychology, software engineering, neuroscience, mycology and botany**. I’m fascinated by how our brains work, how we process emotion and information, and how we can design systems that feel kinder and more intuitive.

    I’m also a water-baby. I adore the ocean; its mystery, its ecosystems, and the stories it holds.

    **I help NGOs and growing businesses build:**

    * Human-centred brands and interfaces
    * Thoughtful automation and AI tools
    * Systems that feel calm, clear, and kind to use


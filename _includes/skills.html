<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;800&display=swap" rel="stylesheet">

<section class="skills-tabs-ocean" aria-label="Skills">
  <div class="skills-tabs-grid" id="skillsCards"></div>
</section>

<script>
/**
 * Edit this data only ✅
 * - Each group becomes a card
 * - Skills are auto-paged in batches of 5
 * - "Experience" tab shows matching years (optional)
 */
const SKILL_GROUPS = [

    ]
  },
  {

    icon: "◼︎",
    skills: [
      { name: "Layout & Composition", years: "7+ yrs" },
      { name: "Typography", years: "7+ yrs" },

    ]
  },
  {

    skills: [
      { name: "HTML & CSS", years: "7+ yrs" },

      { name: "ReactJS", years: "4+ yrs" },
      { name: "Responsive Design", years: "7+ yrs" },

      { name: "Design QA", years: "6+ yrs" }
    ]
  },
  {
    title: "Web Platforms & CMS",
    icon: "⧉",
    skills: [
      { name: "Webflow", years: "3+ yrs" },
      { name: "WordPress", years: "7+ yrs" },
      { name: "Wix", years: "3+ yrs" },
      { name: "Squarespace", years: "3+ yrs" },
      { name: "SEO & Analytics", years: "4+ yrs" }
    ]
  },
  {
    title: "Motion & Micro-interactions",
    icon: "✳︎",
    skills: [
      { name: "Rive", years: "2+ yrs" },
      { name: "After Effects", years: "4+ yrs" },
      { name: "Motion Principles", years: "5+ yrs" },
      { name: "Micro-interactions", years: "6+ yrs" },

      { name: "Delight with restraint", years: "∞" }
    ]
  },
  {
    title: "Systems, Robotics & Backend",
    icon: "⚙︎",
    skills: [
      { name: "Unity", years: "4+ yrs" },
      { name: "C#", years: "4+ yrs" },
      { name: "Python", years: "7+ yrs" },
      { name: "Golang", years: "3+ yrs" },

      { name: "SQL (PostgreSQL / MySQL)", years: "6+ yrs" },
      { name: "Firebase / Firestore", years: "5+ yrs" },

    ]
  },
  {

    icon: "⟲",
    skills: [

    ]
  },
  {
    title: "Data, AI & Analytics",
    icon: "∿",
    skills: [
      { name: "Pandas", years: "5+ yrs" },
      { name: "NumPy", years: "5+ yrs" },
      { name: "Plotly", years: "3+ yrs" }
    ]
  }
];

// ===== Render =====
(function renderSkillsCards(){
  const root = document.getElementById("skillsCards");
  if (!root) return;

  const chunk = (arr, size) => {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  };

  const esc = (s) => String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

  root.innerHTML = "";

  SKILL_GROUPS.forEach((g, cardIndex) => {
    const pages = chunk(g.skills || [], 5);          // Skills pages (max 5 per tab)
    const cardId = `sc-${cardIndex}`;
    const firstSkillsId = `${cardId}-skills-0`;
    const expId = `${cardId}-exp`;

    const buttons = [];
    const sections = [];

    // Skills pages
    pages.forEach((page, pi) => {
      const secId = `${cardId}-skills-${pi}`;
      const label = pages.length > 1 ? `Skills ${pi+1}` : "Skills";
      buttons.push({ label, target: `#${secId}`, kind: "skills", active: pi === 0 });

      const list = page.map(s => `<li class="st-skill">${esc(s.name)}</li>`).join("");
      sections.push(`
        <section class="st-section ${pi === 0 ? "is-active" : ""}" id="${secId}">
          <div class="st-content">
            <ul class="st-skilllist" aria-label="${esc(g.title)} skills page ${pi+1}">
              ${list}
            </ul>
          </div>
        </section>
      `);
    });

    // Experience tab (shows all, matches skills)
    buttons.push({ label: "Experience", target: `#${expId}`, kind: "exp", active: false });

    const expRows = (g.skills || []).map(s => `
      <div class="st-exp-row">
        <div class="st-exp-skill">${esc(s.name)}</div>
        <div class="st-exp-years">${esc(s.years ?? "—")}</div>
      </div>
    `).join("");

    sections.push(`
      <section class="st-section" id="${expId}">
        <div class="st-content">
          <div class="st-exp" role="list" aria-label="${esc(g.title)} experience">
            ${expRows}
          </div>
        </div>
      </section>
    `);

    const btnHtml = buttons.map(b => `
      <button
        type="button"
        class="${b.active ? "is-active" : ""}"
        data-section="${b.target}"
        aria-controls="${b.target.slice(1)}"
        aria-selected="${b.active ? "true" : "false"}"
        role="tab"
      >${esc(b.label)}</button>
    `).join("");

    const card = document.createElement("article");
    card.className = "st-cardWrap";
    card.innerHTML = `
      <div class="st-card" data-state="#${firstSkillsId}">
        <header class="st-head">
          <h3 class="st-title">${esc(g.title)}</h3>
          <div class="st-mark" aria-hidden="true">${esc(g.icon || "▦")}</div>
        </header>

        <div class="st-main" role="tabpanel">
          ${sections.join("")}
        </div>

        <nav class="st-tabs" role="tablist" aria-label="${esc(g.title)} tabs">
          ${btnHtml}
        </nav>
      </div>
    `;

    root.appendChild(card);
  });

  // ===== Tabs behavior (scoped per card) =====
  root.querySelectorAll(".st-card").forEach((card) => {
    const btns = card.querySelectorAll(".st-tabs button");
    const secs = card.querySelectorAll(".st-section");

    const setActive = (targetSel) => {
      const sec = card.querySelector(targetSel);
      if (!sec) return;

      // card "is-active" like the pen (optional hook)
      card.classList.toggle("is-active", targetSel.includes("exp"));

      card.setAttribute("data-state", targetSel);

      secs.forEach(s => s.classList.remove("is-active"));
      btns.forEach(b => {
        b.classList.remove("is-active");
        b.setAttribute("aria-selected", "false");
        b.setAttribute("tabindex", "-1");
      });

      const activeBtn = Array.from(btns).find(b => b.getAttribute("data-section") === targetSel);
      if (activeBtn) {
        activeBtn.classList.add("is-active");
        activeBtn.setAttribute("aria-selected", "true");
        activeBtn.setAttribute("tabindex", "0");
      }
      sec.classList.add("is-active");
    };

    btns.forEach((b) => {
      b.addEventListener("click", () => setActive(b.getAttribute("data-section")));
    });

    // keyboard arrows (nice-to-have)
    card.querySelector(".st-tabs")?.addEventListener("keydown", (e) => {
      const keys = ["ArrowLeft", "ArrowRight", "Home", "End"];
      if (!keys.includes(e.key)) return;

      const arr = Array.from(btns);
      const i = arr.findIndex(x => x.classList.contains("is-active"));
      let n = i;

      if (e.key === "ArrowLeft") n = Math.max(0, i - 1);
      if (e.key === "ArrowRight") n = Math.min(arr.length - 1, i + 1);
      if (e.key === "Home") n = 0;
      if (e.key === "End") n = arr.length - 1;

      e.preventDefault();
      arr[n].focus();
      arr[n].click();
    });

    // ensure first tab active
    const first = card.querySelector('.st-tabs button.is-active') || card.querySelector(".st-tabs button");
    if (first) setActive(first.getAttribute("data-section"));
  });
})();
</script>

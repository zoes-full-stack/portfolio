<section class="ocean-gallery" id="oceanGallery">
  <!-- Local loading overlay (only covers this section) -->
  <div class="ocean-gallery__loading" aria-live="polite" aria-label="Loading media">
    <div class="ocean-gallery__loadingContainer">
      <p class="ocean-gallery__counter">0%</p>
      <div class="ocean-gallery__line" aria-hidden="true"></div>
    </div>
  </div>

  <header class="ocean-gallery__header">
    <h2 class="ocean-gallery__title">Gallery Example</h2>
    <p class="ocean-gallery__subtitle">
      Posters load first. Silent videos play on scroll. Audio pieces open in the modal.
    </p>
  </header>

  <div class="ocean-gallery__masonry" role="list" data-masonry></div>

  <!-- Modal (scoped; still fixed to viewport but styles are namespaced) -->
  <div class="ocean-gallery__modal" aria-hidden="true" data-modal>
    <div class="ocean-gallery__modalBackdrop" data-close="true"></div>

    <div class="ocean-gallery__modalPanel" role="dialog" aria-modal="true" aria-label="Media viewer">
      <button class="ocean-gallery__modalClose" type="button" data-close="true" aria-label="Close">✕</button>

      <div class="ocean-gallery__modalMedia" data-modal-media></div>

      <div class="ocean-gallery__modalMeta">
        <div class="ocean-gallery__modalTitle" data-modal-title></div>

        <div class="ocean-gallery__modalActions">
          <button class="ocean-gallery__btn" type="button" data-modal-mute hidden>🔇 Muted</button>
          <a class="ocean-gallery__btn ocean-gallery__btn--ghost" href="#" target="_blank" rel="noreferrer" data-modal-src hidden>
            Open source
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

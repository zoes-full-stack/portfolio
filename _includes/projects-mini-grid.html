{% assign list = include.list %}
{% if list and list.size > 0 %}
  <div class="cat">
    <h3 class="cat-title">{{ include.title }}</h3>

    <div class="mini-grid">
      {% for p in list %}
        <a class="mini" href="{{ p.url | relative_url }}">
          <div class="mini-top">
            <span class="mini-title">{{ p.title }}</span>
            <span class="mini-dot" aria-hidden="true">◦</span>
          </div>

          <div class="mini-tags">
            {% for t in p.tags limit: 3 %}
              <span class="tag tag-mini">{{ t }}</span>
            {% endfor %}
          </div>

          <div class="mini-more">
            <p class="mini-blurb">{{ p.blurb }}</p>
            <p class="mini-proof">{{ p.proof }}</p>
          </div>
        </a>
      {% endfor %}
    </div>
  </div>
{% endif %}

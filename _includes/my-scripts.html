<script>
(function () {
  function initTimelineOnce(selector, idPrefix) {
    const el = document.querySelector(selector);
    if (!el) return;

    if (!window.CollapsibleTimeline) return;

    if (el.dataset.timelineInit === "1") return;
    el.dataset.timelineInit = "1";

    new window.CollapsibleTimeline(selector, { idPrefix });
  }

  function runInits() {
    initTimelineOnce("#experienceTimeline", "exp-item");
    initTimelineOnce("#researchTimeline", "res-item");
  }

  window.addEventListener("DOMContentLoaded", runInits);

  const ps = document.getElementById("_pushState");
  if (ps) ps.addEventListener("hy-push-state-load", runInits);
})();
</script>
